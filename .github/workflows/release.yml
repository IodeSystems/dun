# A release of dun. It runs only when started by hand (workflow_dispatch),
# never on a push or a tag: tag a commit vX.Y.Z, then
#   gh workflow run release.yml -f version=vX.Y.Z
# It signs with the repository secret MINISIGN_SECRET_KEY (key 2CC27A171DE03D42,
# set 2026-10-25), whose public half is release/minisign.pub, and verifies the
# manifest with the committed key before publishing. release/deps.json must
# name the tools' Recommended versions (docs/dependencies.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the tag to release, vX.Y.Z (it must exist)"
        required: true

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }} # used as "$VERSION": never pasted into a script
    steps:
      - name: the version
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not vX.Y.Z: $VERSION"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "no MINISIGN_SECRET_KEY secret: see aw4 issue i_1m5r9bx5a53x000taq6xar"; exit 1; fi
          if grep -q PLACEHOLDER release/minisign.pub; then echo "release/minisign.pub is the placeholder: see aw4 issue i_1m5r9bx5a53x000taq6xar"; exit 1; fi
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
      # The tests start the tools (mcpshell above all), so they run against
      # the versions this release ships: deps.json's linux_amd64 tarballs,
      # checked against its sha256.
      - name: the tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for t in mcpshell poly-lsp-mcp raglit; do
            url=$(jq -r --arg t "$t" '.artifacts[$t].files.linux_amd64.url' release/deps.json)
            sum=$(jq -r --arg t "$t" '.artifacts[$t].files.linux_amd64.sha256' release/deps.json)
            curl -fsSL -o "$RUNNER_TEMP/$t.tar.gz" "$url"
            echo "$sum  $RUNNER_TEMP/$t.tar.gz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/$t" && tar -xzf "$RUNNER_TEMP/$t.tar.gz" -C "$RUNNER_TEMP/$t"
            install -m 0755 "$RUNNER_TEMP/$t/$t" "$RUNNER_TEMP/bin/$t"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: test
        run: make test
      # The web app is embedded in the release builds (make release runs make
      # webapp: mobile/ exported for the web).
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: build and sign
        run: make release RELEASE_VERSION="$VERSION" MINISIGN_KEY="$RUNNER_TEMP/minisign.key"
      - name: verify the signature with the committed key
        run: minisign -V -p release/minisign.pub -m "dist/$VERSION/dun-manifest.json"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --title "dun $VERSION" "dist/$VERSION"/*
