# dun.iodesystems.com (docs/registry.md): site/ and the signed registry, on
# GitHub Pages. It runs on a push to main that changes what the site or the
# registry is made from, and by hand. The registry is built from
# site/registry/v1 (tools/mkregistry, which checks every entry against this
# dun), signed with the release key (the MINISIGN_SECRET_KEY secret), and
# verified with the committed public key before it is published. The
# entries' sources are not published, only the index.
#
# Before the first run the owner turns on Pages for the repository with
# "GitHub Actions" as its source and dun.iodesystems.com as its custom
# domain, and adds the DNS record (CNAME dun.iodesystems.com ->
# iodesystems.github.io).
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/extensions/**"
      - "release/deps.json"
      - "tools/mkregistry/**"
      - "internal/registry/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: test the registry and its entries
        run: go test ./internal/registry/ ./tools/mkregistry/
      - name: the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "no MINISIGN_SECRET_KEY secret"; exit 1; fi
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
      - name: build and sign
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -rf _site/registry/v1/extensions _site/registry/v1/presets _site/registry/v1/tools
          go run ./tools/mkregistry -src site/registry/v1 -root . -o _site/registry/v1/index.json
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m _site/registry/v1/index.json -t "dun registry"
          minisign -V -p release/minisign.pub -m _site/registry/v1/index.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
