<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dun</title>
<!-- A stopgap browser client over /api/v1 (REST + the events long-poll),
     until the Expo/react-native-web client (item 13 S5). No build step. -->
<style>
:root {
  --bg: #fbfbfa; --fg: #1d1d1b; --dim: #6b6b66; --line: #e3e2de;
  --card: #ffffff; --accent: #2f6fdb; --user: #eef3fc; --tool: #f4f3ef; --err: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --fg: #e8e7e3; --dim: #9a9993; --line: #2c2c2a;
    --card: #1e1e1c; --accent: #7aa7f5; --user: #1f2a3d; --tool: #232321; --err: #f2867d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
header h1 { font-size: 16px; margin: 0; }
header .sp { flex: 1; }
button, input, textarea { font: inherit; color: inherit; }
button { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; width: 100%; }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
.muted { color: var(--dim); }
.err { color: var(--err); }
.list { display: grid; gap: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; cursor: pointer; }
.item .id { font-family: ui-monospace, monospace; font-size: 13px; }
.item .ws { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
.badge { font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.badge.on { border-color: var(--accent); color: var(--accent); }
#log { display: grid; gap: 8px; padding-bottom: 140px; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; padding: 8px 12px; border-radius: 8px; }
.msg.user { background: var(--user); }
.msg.assistant { background: var(--card); border: 1px solid var(--line); }
.msg.tool { background: var(--tool); font-family: ui-monospace, monospace; font-size: 13px; }
.msg.note { color: var(--dim); font-size: 13px; padding: 2px 12px; }
details summary { cursor: pointer; }
.ask { background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; }
.ask .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
  border-top: 1px solid var(--line); padding: 10px 16px; }
footer .row { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
footer textarea { min-height: 44px; max-height: 40vh; resize: vertical; }
.status { font-size: 13px; color: var(--dim); max-width: 860px; margin: 0 auto 6px; }
</style>
</head>
<body>
<header>
  <h1>dun</h1>
  <span id="where" class="muted"></span>
  <span class="sp"></span>
  <button id="back" hidden>Sessions</button>
  <button id="signout">Forget token</button>
</header>
<main id="app"></main>
<footer id="composer" hidden>
  <div class="status" id="status"></div>
  <div class="row">
    <textarea id="input" placeholder="ask dun to do something… (Enter sends, Shift+Enter newline)"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const app = $("app");
let token = "";
try { token = localStorage.getItem("dun.token") || ""; } catch {}

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { "Authorization": "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { askToken("That token was refused."); throw new Error("unauthorized"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || data.title || r.statusText);
  return data;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// --- sign in ---
function askToken(msg) {
  stopFollowing();
  $("composer").hidden = true; $("back").hidden = true; $("where").textContent = "";
  app.replaceChildren();
  const box = el("div", "list");
  box.append(el("p", "", "Paste the token from `dun dund token`."));
  if (msg) box.append(el("p", "err", msg));
  const inp = el("input"); inp.type = "password"; inp.placeholder = "dun_…"; inp.autocomplete = "off";
  const go = el("button", "primary", "Sign in");
  const submit = () => {
    token = inp.value.trim();
    try { localStorage.setItem("dun.token", token); } catch {}
    showSessions();
  };
  go.onclick = submit;
  inp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  box.append(inp, go);
  app.append(box);
  inp.focus();
}
$("signout").onclick = () => { try { localStorage.removeItem("dun.token"); } catch {} token = ""; askToken(); };

// --- sessions ---
async function showSessions() {
  stopFollowing();
  history.replaceState(null, "", "#");
  $("composer").hidden = true; $("back").hidden = true; $("where").textContent = "sessions";
  app.replaceChildren(el("p", "muted", "loading…"));
  let data;
  try { data = await api("GET", "/api/v1/sessions"); } catch (e) { if (e.message !== "unauthorized") app.replaceChildren(el("p", "err", e.message)); return; }
  const list = el("div", "list");
  const items = (data.items || []).slice().sort((a, b) => b.id.localeCompare(a.id));
  if (!items.length) list.append(el("p", "muted", "No sessions yet — start one in a terminal with dun, or below."));
  for (const s of items) {
    const it = el("div", "item");
    const top = el("div");
    top.append(el("span", "id", s.id + "  "));
    top.append(el("span", "badge" + (s.running ? " on" : ""), s.running ? "running" : "stopped"));
    it.append(top, el("div", "ws", s.workspace));
    it.onclick = () => openSession(s.id, s.workspace);
    list.append(it);
  }
  const create = el("div", "item");
  create.style.cursor = "default";
  const ws = el("input"); ws.placeholder = "/absolute/path/to/a/workspace";
  const b = el("button", "primary", "New session");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "starting…";
    try { const r = await api("POST", "/api/v1/sessions", { workspace: ws.value.trim() }); openSession(r.id, ws.value.trim()); }
    catch (e) { b.disabled = false; b.textContent = "New session"; alertLine(create, e.message); }
  };
  create.append(ws, el("div", "", ""), b);
  list.append(create);
  app.replaceChildren(list);
}
function alertLine(parent, text) { parent.append(el("p", "err", text)); }

// --- one session ---
let following = null; // { id, stop }
function stopFollowing() { if (following) following.stop = true; following = null; }

function openSession(id, workspace) {
  stopFollowing();
  history.replaceState(null, "", "#" + id);
  $("back").hidden = false; $("composer").hidden = false;
  $("where").textContent = workspace ? workspace.split("/").slice(-2).join("/") : id;
  const log = el("div"); log.id = "log";
  app.replaceChildren(log);
  const st = { id, after: 0, stop: false, cur: null, busy: false };
  following = st;
  setStatus("");
  follow(st, log);
  $("input").focus();
}

function setStatus(t) { $("status").textContent = t; }

function add(log, node) {
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  log.append(node);
  if (atBottom) window.scrollTo(0, document.body.scrollHeight);
}

function render(st, log, ev) {
  switch (ev.type) {
    case "history":
      log.replaceChildren(); // a history replaces what is shown
      for (const it of ev.items || []) renderItem(log, it);
      break;
    case "user":
      add(log, el("div", "msg user", ev.content + (ev.queued ? "  (queued)" : "")));
      break;
    case "turn":
      st.busy = true; setStatus("working…");
      break;
    case "token":
      if (!st.cur) { st.cur = el("div", "msg assistant", ""); add(log, st.cur); }
      st.cur.textContent += ev.text;
      break;
    case "message":
      if (st.cur) { st.cur.textContent = ev.content; st.cur = null; }
      else if (ev.content) add(log, el("div", "msg assistant", ev.content));
      break;
    case "tool_call":
      st.cur = null;
      add(log, toolBlock("⚙ " + ev.tool, JSON.stringify(ev.args, null, 2)));
      break;
    case "tool_result":
      add(log, toolBlock("↳ " + ev.tool, ev.result));
      break;
    case "done":
      st.busy = false; st.cur = null; setStatus("");
      break;
    case "error":
      st.busy = false; setStatus("");
      add(log, el("div", "msg note err", "error: " + ev.error));
      break;
    case "ask":
      add(log, askBlock(st, ev.question, ev.options || []));
      break;
    case "answered":
      add(log, el("div", "msg user", ev.value));
      for (const a of log.querySelectorAll(".ask button")) a.disabled = true;
      break;
    case "notification":
      if (ev.kind === "docs") {
        // Each document, why it won and where it came from (an older engine sends neither).
        const lines = ["🔎 " + (ev.surfaced || 0) + " doc(s) surfaced"];
        for (const d of ev.docs || []) {
          lines.push("• " + (d.title || "") + (d.why ? " (" + d.why + ")" : ""));
          if (d.source) lines.push("  " + d.source);
        }
        add(log, el("div", "msg note", lines.join("\n")));
      }
      else if (ev.text) add(log, el("div", "msg note", "🔔 " + ev.text));
      break;
    case "control": case "server":
      if (ev.message) add(log, el("div", "msg note", ev.message));
      break;
    case "engine":
      if (ev.state !== "started") add(log, el("div", "msg note", "engine " + ev.state + (ev.reason ? ": " + ev.reason : "")));
      break;
    case "retry":
      setStatus(ev.text || "retrying…");
      break;
    case "queued":
      setStatus(ev.count + " message(s) queued for the running turn");
      break;
  }
}

function renderItem(log, it) {
  if (it.kind === "user") log.append(el("div", "msg user", it.content));
  else if (it.kind === "assistant") log.append(el("div", "msg assistant", it.content));
  else if (it.kind === "tool_call") log.append(toolBlock("⚙ " + it.tool, JSON.stringify(it.args, null, 2)));
  else if (it.kind === "tool_result") log.append(toolBlock("↳ " + it.tool, it.content));
  else if (it.kind === "notification") log.append(el("div", "msg note", "🔔 " + it.content));
}

function toolBlock(title, body) {
  const d = el("details", "msg tool");
  d.append(el("summary", "", title));
  d.append(el("div", "", body || ""));
  return d;
}

function askBlock(st, q, opts) {
  const box = el("div", "ask");
  box.append(el("div", "", "❓ " + q));
  const row = el("div", "opts");
  for (const o of opts) {
    const b = el("button", "", o);
    b.onclick = () => api("POST", `/api/v1/sessions/${st.id}/answer`, { value: o }).catch((e) => alertLine(box, e.message));
    row.append(b);
  }
  const own = el("input"); own.placeholder = "or type an answer, Enter to send";
  own.onkeydown = (e) => {
    if (e.key === "Enter" && own.value.trim())
      api("POST", `/api/v1/sessions/${st.id}/answer`, { value: own.value.trim() }).catch((er) => alertLine(box, er.message));
  };
  box.append(row, own);
  return box;
}

async function follow(st, log) {
  let backoff = 1000;
  while (!st.stop) {
    try {
      const r = await api("GET", `/api/v1/sessions/${st.id}/events?after=${st.after}&wait=25`);
      if (st.stop) return;
      if (r.snapshot) {
        log.replaceChildren();
        for (const it of r.snapshot.items || []) renderItem(log, it);
        for (const s of r.snapshot.state || []) render(st, log, s);
      }
      for (const ev of r.events || []) render(st, log, ev);
      st.after = r.last;
      backoff = 1000;
    } catch (e) {
      if (st.stop || e.message === "unauthorized") return;
      setStatus("connection lost — retrying (" + e.message + ")");
      await new Promise((res) => setTimeout(res, backoff));
      backoff = Math.min(backoff * 2, 15000);
    }
  }
}

async function send() {
  const inp = $("input");
  const text = inp.value.trim();
  if (!text || !following) return;
  inp.value = "";
  try { await api("POST", `/api/v1/sessions/${following.id}/messages`, { content: text }); }
  catch (e) { inp.value = text; setStatus("not sent: " + e.message); }
}
$("send").onclick = send;
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("back").onclick = showSessions;

if (!token) askToken();
else if (location.hash.length > 1) openSession(location.hash.slice(1), "");
else showSessions();
</script>
</body>
</html>
